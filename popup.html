<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cloud Finder</title>
    <link rel="icon" href="icons/icon16.png" type="image/x-icon" />
    <link rel="stylesheet" href="src/styles/design_variables.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 170px;  /* anpassen, wenn du willst */
            height: 350px;
            overflow: hidden;
            position: relative;
            font-family: var(--font-family-body),sans-serif;
            color: var(--color-text);
            background: var(--color-background);
        }
        /* Dein statisches Hintergrundbild */
        #screenshot {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            /* optional: weichzeichnen */
            /* filter: blur(10px); */
        }
        /* Halbtransparenter Content-Container */
        #content {
            position: relative; z-index: 1;
            margin: var(--spacing-sm);
            padding: var(--spacing-md);
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            max-height: calc(100% - var(--spacing-sm)*2);
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<img id="screenshot" src="icons/Screenshot.png" alt="Background" />
<div id="content">
    <div id="cloud-list"></div>
</div>
<script src="src/popup.js"></script>
</body>
</html>
